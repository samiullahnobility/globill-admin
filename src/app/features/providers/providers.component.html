<section class="page">
  <div class="page-header">
    <div>
      <span class="eyebrow">Provider Directory</span>
      <h1>Providers</h1>
    </div>
  </div>

  <div class="editor surface">
    <h2>{{ editingId ? 'Edit Provider' : 'Create Provider' }}</h2>
    <form [formGroup]="form" (ngSubmit)="save()">
      <mat-form-field appearance="outline">
        <mat-label>Name</mat-label>
        <input matInput formControlName="name">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Type</mat-label>
        <input matInput formControlName="providerType">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Phone</mat-label>
        <input matInput formControlName="phone">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput formControlName="email">
      </mat-form-field>

      <mat-form-field appearance="outline" class="wide">
        <mat-label>Description</mat-label>
        <textarea matInput rows="3" formControlName="description"></textarea>
      </mat-form-field>

      <div class="form-actions">
        <button mat-flat-button type="submit">{{ editingId ? 'Save Changes' : 'Create Provider' }}</button>
        <button mat-button type="button" *ngIf="editingId" (click)="cancel()">Cancel</button>
      </div>
    </form>
  </div>

  <div class="surface">
    <table mat-table [dataSource]="providers">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let provider">{{ provider.name }}</td>
      </ng-container>

      <ng-container matColumnDef="type">
        <th mat-header-cell *matHeaderCellDef>Type</th>
        <td mat-cell *matCellDef="let provider">{{ provider.providerType }}</td>
      </ng-container>

      <ng-container matColumnDef="phone">
        <th mat-header-cell *matHeaderCellDef>Phone</th>
        <td mat-cell *matCellDef="let provider">{{ provider.phone }}</td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let provider">{{ provider.email }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let provider">
          <span class="status" [class.published]="provider.status === 1">{{ statusLabel(provider.status) }}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let provider">
          <button mat-icon-button type="button" aria-label="Edit provider" (click)="edit(provider)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button type="button" aria-label="Deactivate provider" (click)="deactivate(provider)">
            <mat-icon>block</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columns"></tr>
      <tr mat-row *matRowDef="let row; columns: columns;"></tr>
    </table>
  </div>
</section>
