<section class="page">
  <h1>Doctors</h1>

  <div class="surface">
    <table mat-table [dataSource]="doctors">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let doctor">
          {{ doctor.firstName }} {{ doctor.lastName }}
        </td>
      </ng-container>

      <ng-container matColumnDef="credentials">
        <th mat-header-cell *matHeaderCellDef>Credentials</th>
        <td mat-cell *matCellDef="let doctor">{{ doctor.credentials }}</td>
      </ng-container>

      <ng-container matColumnDef="specialty">
        <th mat-header-cell *matHeaderCellDef>Specialty</th>
        <td mat-cell *matCellDef="let doctor">{{ doctor.specialty }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columns"></tr>
      <tr mat-row *matRowDef="let row; columns: columns;"></tr>
    </table>
  </div>
</section>
