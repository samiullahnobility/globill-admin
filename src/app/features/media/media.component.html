<section class="page">
  <div class="page-header">
    <div><span class="eyebrow">Assets</span><h1>Media</h1></div>
    <mat-form-field appearance="outline">
      <mat-label>Provider</mat-label>
      <mat-select [(value)]="selectedProviderId" (selectionChange)="loadMedia()">
        <mat-option *ngFor="let provider of providers" [value]="provider.id">{{ provider.name }}</mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <div class="editor surface">
    <h2>{{ editingId ? 'Edit Media' : 'Add Media' }}</h2>
    <form [formGroup]="form" (ngSubmit)="save()">
      <mat-form-field appearance="outline"><mat-label>Website</mat-label><mat-select formControlName="websiteId"><mat-option [value]="null">Provider library</mat-option><mat-option *ngFor="let website of providerWebsites()" [value]="website.id">{{ website.name }}</mat-option></mat-select></mat-form-field>
      <mat-form-field appearance="outline"><mat-label>File Name</mat-label><input matInput formControlName="fileName"></mat-form-field>
      <mat-form-field appearance="outline"><mat-label>URL</mat-label><input matInput formControlName="url"></mat-form-field>
      <mat-form-field appearance="outline"><mat-label>File Type</mat-label><input matInput formControlName="fileType"></mat-form-field>
      <mat-form-field appearance="outline"><mat-label>File Size</mat-label><input matInput type="number" formControlName="fileSize"></mat-form-field>
      <mat-form-field appearance="outline" class="wide"><mat-label>Alt Text</mat-label><input matInput formControlName="altText"></mat-form-field>
      <div class="form-actions"><button mat-flat-button type="submit">{{ editingId ? 'Save Changes' : 'Add Media' }}</button><button mat-button type="button" *ngIf="editingId" (click)="cancel()">Cancel</button></div>
    </form>
  </div>

  <div class="surface">
    <table mat-table [dataSource]="media">
      <ng-container matColumnDef="fileName"><th mat-header-cell *matHeaderCellDef>Name</th><td mat-cell *matCellDef="let item">{{ item.fileName }}</td></ng-container>
      <ng-container matColumnDef="url"><th mat-header-cell *matHeaderCellDef>URL</th><td mat-cell *matCellDef="let item">{{ item.url }}</td></ng-container>
      <ng-container matColumnDef="fileType"><th mat-header-cell *matHeaderCellDef>Type</th><td mat-cell *matCellDef="let item">{{ item.fileType }}</td></ng-container>
      <ng-container matColumnDef="fileSize"><th mat-header-cell *matHeaderCellDef>Size</th><td mat-cell *matCellDef="let item">{{ item.fileSize }}</td></ng-container>
      <ng-container matColumnDef="actions"><th mat-header-cell *matHeaderCellDef></th><td mat-cell *matCellDef="let item"><button mat-icon-button type="button" (click)="edit(item)"><mat-icon>edit</mat-icon></button><button mat-icon-button type="button" (click)="delete(item)"><mat-icon>delete</mat-icon></button></td></ng-container>
      <tr mat-header-row *matHeaderRowDef="columns"></tr>
      <tr mat-row *matRowDef="let row; columns: columns;"></tr>
    </table>
  </div>
</section>
