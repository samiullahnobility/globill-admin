<section class="page">
  <h1>Appointment Leads</h1>

  <div class="surface">
    <table mat-table [dataSource]="leads">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let lead">
          {{ lead.firstName }} {{ lead.lastName }}
        </td>
      </ng-container>

      <ng-container matColumnDef="contact">
        <th mat-header-cell *matHeaderCellDef>Contact</th>
        <td mat-cell *matCellDef="let lead">
          <div>{{ lead.email }}</div>
          <div class="muted">{{ lead.phone }}</div>
        </td>
      </ng-container>

      <ng-container matColumnDef="preferredDate">
        <th mat-header-cell *matHeaderCellDef>Requested</th>
        <td mat-cell *matCellDef="let lead">
          {{ lead.preferredDate || 'Any date' }}
        </td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let lead">
          <span class="status">
            {{ statusLabel(lead.status) }}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="createdAt">
        <th mat-header-cell *matHeaderCellDef>Created</th>
        <td mat-cell *matCellDef="let lead">
          {{ lead.createdAt }}
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let lead">
          <button
            mat-icon-button
            type="button"
            aria-label="Mark contacted"
            (click)="markContacted(lead)">
            <mat-icon>done</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columns"></tr>
      <tr mat-row *matRowDef="let row; columns: columns;"></tr>
    </table>
  </div>
</section>
