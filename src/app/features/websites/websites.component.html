<section class="page">
  <div class="page-header">
    <h1>Websites</h1>

    <button mat-flat-button>
      <mat-icon>add</mat-icon>
      Add Website
    </button>
  </div>

  <div class="surface">
    <table mat-table [dataSource]="websites">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let website">
          {{ website.name }}
        </td>
      </ng-container>

      <ng-container matColumnDef="domain">
        <th mat-header-cell *matHeaderCellDef>Domain</th>
        <td mat-cell *matCellDef="let website">
          {{ website.domain }}
        </td>
      </ng-container>

      <ng-container matColumnDef="template">
        <th mat-header-cell *matHeaderCellDef>Template</th>
        <td mat-cell *matCellDef="let website">
          {{ website.template }}
        </td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let website">
          <span class="status" [class.published]="website.isPublished">
            {{ website.isPublished ? 'Published' : 'Draft' }}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let website">
          <button
            mat-icon-button
            type="button"
            aria-label="Publish website"
            (click)="publish(website)">
            <mat-icon>publish</mat-icon>
          </button>

          <button
            mat-icon-button
            type="button"
            aria-label="Unpublish website"
            (click)="unpublish(website)">
            <mat-icon>visibility_off</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columns"></tr>
      <tr mat-row *matRowDef="let row; columns: columns;"></tr>
    </table>
  </div>
</section>
