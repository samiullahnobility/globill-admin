<mat-sidenav-container class="shell">
  <mat-sidenav mode="side" opened>
    <div class="brand">
      <span class="brand-mark">G</span>
      <span>
        <strong>Globill</strong>
        <small>Admin CRM</small>
      </span>
    </div>

    <a mat-button routerLink="/dashboard" routerLinkActive="active-link">
      <mat-icon>dashboard</mat-icon>
      Dashboard
    </a>

    <a mat-button routerLink="/providers" routerLinkActive="active-link">
      <mat-icon>local_hospital</mat-icon>
      Providers
    </a>

    <a mat-button routerLink="/websites" routerLinkActive="active-link">
      <mat-icon>language</mat-icon>
      Websites
    </a>

    <a mat-button routerLink="/pages" routerLinkActive="active-link">
      <mat-icon>article</mat-icon>
      Pages
    </a>

    <a mat-button routerLink="/services" routerLinkActive="active-link">
      <mat-icon>medical_services</mat-icon>
      Services
    </a>

    <a mat-button routerLink="/doctors" routerLinkActive="active-link">
      <mat-icon>badge</mat-icon>
      Doctors
    </a>

    <a mat-button routerLink="/locations" routerLinkActive="active-link">
      <mat-icon>place</mat-icon>
      Locations
    </a>

    <a mat-button routerLink="/media" routerLinkActive="active-link">
      <mat-icon>image</mat-icon>
      Media
    </a>

    <a mat-button routerLink="/appointment-leads" routerLinkActive="active-link">
      <mat-icon>assignment</mat-icon>
      Appointment Leads
    </a>

    <a mat-button routerLink="/seo" routerLinkActive="active-link">
      <mat-icon>manage_search</mat-icon>
      SEO
    </a>

    <a mat-button routerLink="/audit" routerLinkActive="active-link">
      <mat-icon>history</mat-icon>
      Audit Logs
    </a>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar>
      <span>Healthcare Website CRM</span>
      <span class="toolbar-spacer"></span>
      <button mat-button type="button" (click)="logout()">
        <mat-icon>logout</mat-icon>
        Logout
      </button>
    </mat-toolbar>

    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>
